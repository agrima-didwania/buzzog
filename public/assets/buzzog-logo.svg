<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60" fill="none">
  <defs>
    <linearGradient id="magentaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E4222E" />
      <stop offset="100%" stop-color="#8F1720" />
    </linearGradient>
    <linearGradient id="limeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6FCF4A" />
      <stop offset="100%" stop-color="#4E9E32" />
    </linearGradient>
  </defs>
  <!-- Main Text BUZZ -->
  <text x="4" y="44" font-family="'Anton', sans-serif, 'Impact', 'Arial Black'" font-size="44" font-weight="900" fill="#F4F4F4" letter-spacing="1.5">BUZZ</text>
  <!-- OG Badge -->
  <rect x="122" y="10" width="56" height="38" rx="8" fill="url(#magentaGrad)" />
  <text x="133" y="38" font-family="'Anton', sans-serif, 'Impact', 'Arial Black'" font-size="28" font-weight="900" fill="#FFFFFF" letter-spacing="1">OG</text>
  <!-- Dot / Lightning Accent -->
  <circle cx="190" cy="20" r="4" fill="#6FCF4A" />
  <text x="4" y="56" font-family="'Space Mono', monospace, sans-serif" font-size="9" font-weight="700" fill="#9A9A9A" letter-spacing="3.2">ORIGINALS</text>
</svg>
